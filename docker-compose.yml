
services:
  backend:
    build:
      context: ./backend
    image: taskflow-backend:1.0
    container_name: taskflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - taskflow

  frontend:
    build:
      context: ./frontend
    image: taskflow-frontend:1.0
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - taskflow

networks:
  taskflow:
    external: true
    name: Taskflow-network

